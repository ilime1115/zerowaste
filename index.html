<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZeroWaste AI</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>
    <style>
        :root { --primary: #27ae60; --accent: #e67e22; --bg: #f4f7f6; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); margin: 0; color: #333; }
        header { background: var(--primary); color: white; padding: 25px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .container { max-width: 550px; margin: 20px auto; padding: 0 15px; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); text-align: center; }
        .upload-area { border: 2px dashed #ccc; padding: 30px; border-radius: 15px; cursor: pointer; margin-bottom: 20px; }
        #preview { width: 100%; border-radius: 10px; display: none; margin-top: 15px; }
        .btn { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; }
        #result-area { display: none; margin-top: 25px; text-align: left; background: #f9fffb; padding: 20px; border-radius: 15px; border: 1px solid #e0f2f1; }
        .loading { display: none; margin: 20px 0; color: var(--primary); font-weight: bold; }
        #model-status { font-size: 13px; color: #999; margin-bottom: 10px; }
    </style>
</head>
<body>

<header>
    <h1>🥗 ZeroWaste AI</h1>
    <p>AI 잔반 분석 시스템</p>
</header>

<div class="container">
    <div class="card">
        <div id="model-status">인공지능 엔진 로딩 중...</div>
        <div class="upload-area" onclick="document.getElementById('file-input').click()">
            <p id="upload-text">📸 분석할 음식 사진을 선택하세요</p>
            <input type="file" id="file-input" accept="image/*" style="display: none;">
            <img id="preview">
        </div>
        <button id="analyze-btn" class="btn" style="display: none;">분석 시작</button>
        <div id="loading" class="loading">AI가 이미지를 분류하고 있습니다...</div>

        <div id="result-area">
            <h3 style="margin-top:0">📊 분석 리포트</h3>
            <p><strong>분류 항목:</strong> <span id="res-tag" style="color:var(--accent); font-weight: bold;">-</span></p>
            <hr style="border:0; border-top:1px solid #eee; margin:15px 0;">
            <p id="advice-text" style="font-size: 14px; line-height: 1.7; color: #444; word-break: keep-all;"></p>
            <button class="btn" onclick="location.reload()" style="background:#95a5a6; margin-top:15px">다른 사진 분석하기</button>
        </div>
    </div>
</div>

<script>
    let model;

    function getFinalResult(aiResult) {
        const name = aiResult.toLowerCase();
        if (name.includes('carbonara') || name.includes('noodle') || name.includes('pasta') || name.includes('spaghetti')) {
            return { label: "면 요리", key: "noodle" };
        }
        if (name.includes('pot') || name.includes('soup') || name.includes('stew') || name.includes('consomme') || name.includes('hotpot')) {
            return { label: "찌개/국물 요리", key: "soup" };
        }
        if (name.includes('rice') || name.includes('bread') || name.includes('sandwich') || name.includes('burger')) {
            return { label: "밥 및 주식류", key: "rice" };
        }
        if (name.includes('meat') || name.includes('beef') || name.includes('pork') || name.includes('chicken') || name.includes('poultry')) {
            return { label: "육류 요리", key: "meat" };
        }
        if (name.includes('vegetable') || name.includes('salad') || name.includes('broccoli')) {
            return { label: "채소/샐러드", key: "vegetable" };
        }
        return { label: "일반 상차림/기타", key: "default" };
    }

    async function init() {
        try {
            model = await mobilenet.load();
            document.getElementById('model-status').innerText = "✅ AI 엔진 준비 완료";
        } catch (e) {
            document.getElementById('model-status').innerText = "❌ 엔진 로드 실패";
        }
    }
    init();

    document.getElementById('file-input').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
            document.getElementById('preview').src = ev.target.result;
            document.getElementById('preview').style.display = 'block';
            document.getElementById('upload-text').style.display = 'none';
            document.getElementById('analyze-btn').style.display = 'block';
            document.getElementById('result-area').style.display = 'none';
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    document.getElementById('analyze-btn').onclick = async () => {
        const btn = document.getElementById('analyze-btn');
        const loading = document.getElementById('loading');
        btn.style.display = 'none';
        loading.style.display = 'block';

        try {
            const res = await model.classify(document.getElementById('preview'));
            const final = getFinalResult(res[0].className);
            
            document.getElementById('res-tag').innerText = final.label;
            setAdvice(final.key);
            
            loading.style.display = 'none';
            document.getElementById('result-area').style.display = 'block';
        } catch (err) {
            alert("오류가 발생했습니다.");
            loading.style.display = 'none';
            btn.style.display = 'block';
        }
    };

    function setAdvice(key) {
        const adviceMap = {
            'noodle': `
                <div style="margin-bottom:10px;">🍝 <b>[면 요리 분석 결과]</b></div>
                면류는 조리 후 시간이 지나면 전분이 호화되어 재활용이 가장 어려운 품목 중 하나입니다. 
                <br>• <b>환경 팁:</b> 면 요리 1인분 정량은 건면 기준 80~100g입니다. 손가락으로 500원 동전 크기를 만드는 연습을 해보세요. 
                <br>• <b>실천 방안:</b> 남은 면은 물기를 완전히 제거한 뒤 올리브유를 살짝 발라 보관하세요.`,

            'soup': `
                <div style="margin-bottom:10px;">🍲 <b>[국물 요리 분석 결과]</b></div>
                한국 식단에서 발생하는 음식물 쓰레기의 약 50% 이상이 수분을 포함한 국물 요리입니다. 
                <br>• <b>환경 팁:</b> 국물 1리터를 정화하기 위해서는 그 수천 배에 달하는 깨끗한 물이 필요합니다. 
                <br>• <b>실천 방안:</b> 처음부터 국그릇의 크기를 평소보다 한 단계 작은 것으로 바꿔보세요. 남은 국물은 건더기를 걸러낸 뒤 얼음틀에 소분 냉동하세요.`,

            'rice': `
                <div style="margin-bottom:10px;">🍚 <b>[주식류 분석 결과]</b></div>
                밥이 남는다는 것은 구매 단계 혹은 취사 단계에서의 양 조절 실패를 의미합니다. 
                <br>• <b>환경 팁:</b> 쌀 1kg을 생산하는 데는 약 2,500리터의 물이 소비됩니다. 밥 한 톨을 아끼는 것이 곧 수자원 보호입니다. 
                <br>• <b>실천 방안:</b> '냉동 밥 전용 용기'를 활용하세요. 밥이 남을 것 같으면 식사 직전 미리 용기에 덜어 냉동 보관하세요.`,

            'meat': `
                <div style="margin-bottom:10px;">🥩 <b>[육류/단백질 분석 결과]</b></div>
                육류는 모든 식재료 중 탄소 발자국이 가장 높습니다. 소고기 1kg 생산 시 발생하는 탄소는 자동차가 100km를 주행할 때 나오는 양과 비슷합니다.
                <br>• <b>환경 팁:</b> 육류 잔반을 줄이는 것은 온실가스 감축에 가장 직접적인 도움이 됩니다. 
                <br>• <b>실천 방안:</b> 대용량 묶음 판매보다는 다소 비싸더라도 '소포장 제품'을 구매하세요. 남은 고기는 조리 전 미리 밑간을 해서 보관하면 신선도를 2~3일 더 유지할 수 있습니다.`,

            'vegetable': `
                <div style="margin-bottom:10px;">🥗 <b>[채소 및 샐러드 분석 결과]</b></div>
                채소류는 유통기한이 짧아 신선도 문제로 인해 버려지는 비중이 높습니다. 
                <br>• <b>환경 팁:</b> 가정에서 버려지는 채소 쓰레기는 매립 시 메탄가스를 발생시키는 주범이 됩니다. 
                <br>• <b>실천 방안:</b> 시들기 시작한 채소는 즉시 세척 후 물기를 제거하여 용도별로 다져서 냉동 보관하세요. 샐러드 채소의 경우 키친타월을 깐 밀폐용기에 보관하면 신선도를 최대 2배까지 늘릴 수 있습니다.`,

            'default': `
                <div style="margin-bottom:10px;">🍱 <b>[복합 상차림 분석 결과]</b></div>
                여러 반찬이 동시에 남았다면 식단 구성의 '가짓수'를 점검해 볼 필요가 있습니다. 
                <br>• <b>환경 팁:</b> 반찬 가짓수를 하나만 줄여도 연간 음식물 쓰레기 배출량을 20% 이상 감축할 수 있습니다. 
                <br>• <b>실천 방안:</b> 한 그릇에 먹을 만큼만 덜어 먹는 습관은 설거지에 필요한 물과 세제 사용량까지 줄일 수 있습니다.`
        };
        document.getElementById('advice-text').innerHTML = adviceMap[key];
    }
</script>

</body>
</html>
